<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Cost-benefit analýza soukromí a anonymity. Pro nováčky i profesionály. Funguje offline, nic neodesílá.">
<meta name="theme-color" content="#F2F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1312" media="(prefers-color-scheme: dark)">
<title>Bilance soukromí</title>

<style>
/* Layout: horní lišta, pod ní buď průvodce (krokový sloupec) nebo expertní dvousloupec (editace | výsledek) */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --soft:#E7EAE3; --ink:#141A17; --muted:#56605A; --line:#D5D9D1;
  --accent:#2445C2; --accent-ink:#FFFFFF; --pro:#1C7346; --con:#AE372B; --warn:#8A5A00;
  --pro-soft:#E1F0E7; --con-soft:#F6E3E0; --warn-soft:#F5ECD7; --accent-soft:#E3E8FA;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --r:10px; color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1312; --surface:#171C1A; --soft:#202624; --ink:#E5EAE6; --muted:#9AA49E; --line:#2D3532;
    --accent:#8DA0FF; --accent-ink:#0F1312; --pro:#5CC58D; --con:#F07D70; --warn:#E2B04C;
    --pro-soft:#18302A; --con-soft:#3A2220; --warn-soft:#33291A; --accent-soft:#1E2544; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1312; --surface:#171C1A; --soft:#202624; --ink:#E5EAE6; --muted:#9AA49E; --line:#2D3532;
  --accent:#8DA0FF; --accent-ink:#0F1312; --pro:#5CC58D; --con:#F07D70; --warn:#E2B04C;
  --pro-soft:#18302A; --con-soft:#3A2220; --warn-soft:#33291A; --accent-soft:#1E2544; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-text-size-adjust:100%}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
h2{font-size:1.5rem;letter-spacing:-.01em}
h3{font-size:1.06rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.lead{color:var(--muted);max-width:65ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;letter-spacing:-.01em}
.brand svg{flex:none}
.cur{color:var(--muted);font-size:.9rem;max-width:32ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--soft)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.9rem;color:var(--muted)}
.seg.theme button{padding:5px 9px;display:inline-grid;place-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:.92rem;line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--con)}
.btn.sm{padding:4px 9px;font-size:.85rem}
.iconbtn{border:1px solid transparent;background:transparent;border-radius:6px;cursor:pointer;width:30px;height:30px;display:inline-grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--soft);color:var(--ink)}

main{max-width:1240px;margin:0 auto;padding:20px 16px 80px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.privacy-note{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}

/* guide */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;counter-reset:s}
.steps button{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.steps button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--soft);font-size:.78rem;font-weight:700;color:var(--muted)}
.steps button[aria-current="step"]{border-color:var(--accent);color:var(--ink);font-weight:600}
.steps button[aria-current="step"] .n{background:var(--accent);color:var(--accent-ink)}
.steps button.done .n{background:var(--pro-soft);color:var(--pro)}
.guide{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.navbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.explain{background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;font-size:.95rem;max-width:none}
.explain strong{font-weight:650}

.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tpl{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.tpl:hover{border-color:var(--accent)}
.tpl b{font-weight:650}
.tpl span{font-size:.86rem;color:var(--muted)}
.tpl .tag{align-self:flex-start;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}

label.f{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;min-width:0}
input[type=text],textarea{width:100%}
textarea{min-height:90px;resize:vertical}
.choice{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;background:var(--surface)}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:4px}
.choice small{display:block;color:var(--muted)}

.assets{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.asset{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);background:var(--surface)}
.asset:first-child{border-top:0}
.asset small{display:block;color:var(--muted);font-size:.8rem}
.lvl{display:inline-flex;gap:3px;flex-wrap:wrap}
.lvl button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.lvl button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:620px){.asset{grid-template-columns:1fr}}

.checks{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.checks label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;cursor:pointer}
.checks input{margin-top:5px}

/* options */
.opt{display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.opt .badge{flex:none}
.badge{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.sq{background:var(--soft)}
.badge.ch{background:var(--accent-soft);color:var(--accent)}

/* quadrants */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.quad{grid-template-columns:1fr}}
.qbox{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.qhead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.qhead h3{font-size:.98rem}
.qhead .sum{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.qbox.cost{border-top:3px solid var(--con)}
.qbox.benefit{border-top:3px solid var(--pro)}
.qbox.cost .sum{color:var(--con)}
.qbox.benefit .sum{color:var(--pro)}
.qhint{padding:8px 14px 0;font-size:.84rem;color:var(--muted)}
.qbody{padding:8px 10px 12px;display:flex;flex-direction:column;gap:6px}
.optgroup{display:flex;flex-direction:column;gap:10px}
.optgroup > h3{display:flex;gap:8px;align-items:center}

.item{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border-radius:8px;background:var(--soft)}
.item .t{flex:1 1 220px}
.item select{padding:5px 6px;font-size:.85rem}
.item .adv{display:none;flex-basis:100%;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem}
.item.open .adv{display:flex}
.item .adv .note{flex:1 1 180px}
.item input.p{width:64px}
.addrow{display:flex;gap:6px}
.addrow input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:2px 2px 0}
.chip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:3px 9px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.empty{font-size:.85rem;color:var(--muted);padding:4px 6px}

.meter{display:flex;gap:10px;align-items:center;font-size:.86rem;flex-wrap:wrap}
.meter .track{flex:1 1 200px;height:10px;border-radius:999px;background:var(--con-soft);overflow:hidden;min-width:120px}
.meter .fill{height:100%;background:var(--pro)}

/* bias */
.bias{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.bias .ans{display:flex;gap:4px}
.bias .ans button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 12px;cursor:pointer;font-size:.86rem}
.bias .ans button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bias .nudge{font-size:.88rem;background:var(--warn-soft);border-radius:8px;padding:8px 10px}

/* results */
.results{display:flex;flex-direction:column;gap:14px}
.verdict{border-radius:var(--r);padding:14px 16px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.verdict .v{font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.verdict.good{border-left:5px solid var(--pro)}
.verdict.bad{border-left:5px solid var(--con)}
.verdict.mid{border-left:5px solid var(--warn)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.good{background:var(--pro-soft);color:var(--pro)}
.pill.bad{background:var(--con-soft);color:var(--con)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:1fr 8.5em;gap:8px;align-items:center}
.bar > span{display:block;height:14px;border-radius:3px;grid-column:1;grid-row:1}
.bar::before{content:"";grid-column:1;grid-row:1;height:14px;border-radius:3px;background:var(--soft)}
.bar .pro{background:var(--pro)} .bar .con{background:var(--con)}
.bar em{font-style:normal;font-size:.82rem;color:var(--muted)}
td.optc{min-width:14ch}
.insights{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.insights li{padding:8px 10px 8px 12px;border-radius:8px;font-size:.9rem;border-left:3px solid var(--line);background:var(--soft)}
.insights li.good{border-left-color:var(--pro);background:var(--pro-soft)}
.insights li.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.insights li.bad{border-left-color:var(--con);background:var(--con-soft)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.8rem}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.drivers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.drivers{grid-template-columns:1fr}}
.drivers ol{margin:4px 0 0;padding-left:20px;font-size:.88rem}
details{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;background:var(--surface)}
details summary{cursor:pointer;font-weight:600;font-size:.92rem}
details[open] summary{margin-bottom:8px}

/* expert */
.expert-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,1fr);gap:18px;align-items:start}
.expert-grid > aside{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto;display:flex;flex-direction:column;gap:12px}
@media (max-width:980px){.expert-grid{grid-template-columns:1fr}.expert-grid > aside{position:static;max-height:none}}
.expert .item .adv{display:flex}
.expert .item .more{display:none}
.sec{display:flex;flex-direction:column;gap:12px}
.sec + .sec{margin-top:18px}
.sec > h2{font-size:1.15rem;display:flex;gap:8px;align-items:baseline}
.sec > h2 .k{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.weights{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.weights label{font-size:.88rem;display:flex;flex-direction:column;gap:4px}

/* glossary links */
.g{border:0;background:none;padding:0;color:inherit;border-bottom:1px dotted var(--accent);cursor:help;font:inherit}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,12,.5);display:none;place-items:center;padding:16px;z-index:50}
.modal.on{display:grid}
.modal .box{background:var(--surface);border-radius:12px;max-width:640px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.modal .box textarea{min-height:220px;font-family:var(--mono);font-size:.8rem}
.alist{display:flex;flex-direction:column;gap:6px}
.alist .a{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.alist .a.cur{border-color:var(--accent)}
.alist .a .grow{flex:1;min-width:0}
.alist .a b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}
.lvl-h{display:flex;gap:10px;align-items:baseline;margin-top:6px}
.lvl-h h3{font-size:.95rem}
.lvl-h span{font-size:.82rem;color:var(--muted)}
.tpl.rec{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.tpl .recb{align-self:flex-start;font-size:.7rem;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:1px 7px}
.why{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.why label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;background:var(--surface)}
.why label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.why input{margin-top:4px}
.why small{display:block;color:var(--muted)}
.cap{font-family:var(--mono);font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}
.tp{display:flex;gap:6px;flex-wrap:wrap}
.tp button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;flex:1 1 180px}
.tp button small{display:block;color:var(--muted);font-size:.8rem}
.tp button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.safety{border:2px solid var(--con);background:var(--con-soft);border-radius:var(--r);padding:12px 14px}
.src{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .top,.steps,.navbar,.no-print,.addrow,.chips,.iconbtn{display:none!important}
  body{background:#fff;color:#000}
  .expert-grid{grid-template-columns:1fr}
  .expert-grid > aside{position:static;max-height:none}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="currentColor"/><path d="M14 22h36" stroke="var(--bg)" stroke-width="4" stroke-linecap="round"/><path d="M32 14v36" stroke="var(--bg)" stroke-width="4" stroke-linecap="round"/><rect x="12" y="30" width="12" height="18" rx="2" fill="var(--pro)"/><rect x="40" y="38" width="12" height="10" rx="2" fill="var(--con)"/></svg>
      <span id="app-name">Bilance soukromí</span>
    </div>
    <span class="cur" id="cur-title"></span>
    <span class="spacer"></span>
    <div class="seg theme" role="group" aria-label="Vzhled / Theme" id="theme-seg">
      <button type="button" data-act="theme" data-v="auto" id="t-auto"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
      <button type="button" data-act="theme" data-v="light" id="t-light"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" data-act="theme" data-v="dark" id="t-dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
    <div class="seg" role="group" aria-label="Jazyk / Language">
      <button type="button" data-act="lang" data-v="cs" id="l-cs">CZ</button>
      <button type="button" data-act="lang" data-v="en" id="l-en">EN</button>
    </div>
    <div class="seg" role="group" aria-label="Režim">
      <button type="button" data-act="mode" data-v="guide" id="m-guide"></button>
      <button type="button" data-act="mode" data-v="expert" id="m-expert"></button>
    </div>
    <button class="btn" type="button" data-act="list" id="b-list"></button>
    <button class="btn ghost" type="button" data-act="install" id="install-btn" hidden></button>
    <button class="iconbtn" type="button" data-act="about" aria-label="O aplikaci a slovníček" title="O aplikaci a slovníček">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4.5"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/></svg>
    </button>
  </div>

    if(R.best && !R.best.sq && t[R.best.id].cost <= 4) out.push({c:'warn', h:tr('Možná málo','Possibly too little'), t:tr('Proti někomu, kdo jde cíleně po vás, jedno levné opatření nestačí. Hledejte nejslabší článek a myslete na pohyb, adresu a lidi kolem, ne jen na technologii.','Against someone targeting you, one cheap measure isn’t enough. Look for the weakest link and think about movements, address and the people around you, not just tech.')});
  } else if(a.targeted==='no' && maxCap<=2 && R.best && !R.best.sq && t[R.best.id].cost >= 15) out.push({c:'info', h:tr('Možná přestřelujete','Possibly overkill'), t:tr('Proti plošnému sběru dat (reklama, platformy) obvykle stačí levnější opatření. Silné nástroje proti slabému protivníkovi stojí čas a pozornost, které chybí jinde.','Against untargeted collection (ads, platforms) cheaper measures usually suffice. Heavy tools against a weak adversary cost time and attention needed elsewhere.')});
  if(a.adv.includes('future')) out.push({c:'info', h:tr('Budoucí moc','Future power'), t:tr('Data vydrží déle než vlády i firmy. Údaj ze sčítání nebo z daňového přiznání, který dnes nikomu nevadí, může mít zítra jiný význam.','Data outlives governments and companies. A census or tax record harmless today may mean something else tomorrow.')});
  if(a.adv.includes('criminals') && ((a.assets.finance||0)>=3 || (a.assets.location||0)>=3)) out.push({c:'warn', h:tr('Fyzické bezpečí','Physical safety'), t:tr('Kombinace „kolik mám“ a „kde bydlím“ je pro zločince nejcennější. Když unikne jedna databáze se jménem a adresou, ochrana jinde už to nevrátí.','“What I own” plus “where I live” is what criminals value most. Once one database with name and address leaks, protection elsewhere can’t undo it.')});
  BIASES.forEach(b=>{ const ans = a.biases[b.k]; if(ans && ans!==b.good) out.push({c:'warn', h:tr('Kontrola předsudků','Bias check'), t:L(b.nudge)}); });
  if(a.items.length && BIASES.every(b=>!a.biases[b.k])) out.push({c:'info', h:tr('Kontrola předsudků','Bias check'), t:tr('Ještě jste neprošli kontrolu předsudků. Trvá dvě minuty a často změní odhady víc než cokoli jiného.','You haven’t done the bias check yet. It takes two minutes and often shifts estimates more than anything else.')});
  return out;
}

/* ================= RENDER HELPERS ================= */
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const g = (key, text) => `<button type="button" class="g" data-act="gloss" data-k="${key}">${esc(text)}</button>`;
const X = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function isTwo(a){ return a.options.length===2; }
function qLabel(a,o,k){
  if(o.sq) return k==='cost' ? tr('Náklady toho, že nic nezměním','Costs of changing nothing') : tr('Přínosy toho, že nic nezměním','Benefits of changing nothing');
  if(isTwo(a)) return k==='cost' ? tr('Náklady změny','Costs of changing') : tr('Přínosy změny','Benefits of changing');
  return (k==='cost' ? tr('Náklady: ','Costs: ') : tr('Přínosy: ','Benefits: ')) + o.name;
}
function qHint(o,k){
  if(o.sq) return k==='cost' ? tr('Co vás stojí, když zůstanete u současného stavu? Sběr dat, závislost, rizika, autocenzura.','What does staying put cost you? Data collection, lock-in, risks, self-censorship.') : tr('Co vám současný stav dává? Pohodlí, zvyk, kompatibilita s okolím.','What does the status quo give you? Convenience, habit, compatibility.');
  return k==='cost' ? tr('Co vás změna bude stát? Čas, peníze, učení, nepohodlí, sociální tření, disciplína.','What will the change cost? Time, money, learning, hassle, social friction, discipline.') : tr('Co vám změna přinese? Kontrola, svoboda, bezpečí, menší stopa.','What will the change bring? Control, freedom, safety, smaller footprint.');
}
function inspFor(o,k){ return o.sq ? (k==='cost'?INSP.sqCost:INSP.sqBen) : (k==='cost'?INSP.chCost:INSP.chBen); }
function sumOf(a,o,k){ return a.items.filter(it=>it.o===o.id&&it.k===k).reduce((s,it)=>s+itemValue(a,it),0); }

function itemRow(a,it,expert){
  const probOpts = PROB.some(p=>p[0]===+it.p) ? '' : `<option value="${it.p}" selected>${it.p} %</option>`;
  const prob = expert
    ? `<input class="p num" type="number" min="0" max="100" step="5" data-f="p" value="${esc(it.p)}" aria-label="${tr('Pravděpodobnost v procentech','Probability in percent')}" title="%">`
    : `<select data-f="p" aria-label="${tr('Jak pravděpodobné','How likely')}">${probOpts}${PROB.map(p=>`<option value="${p[0]}" ${+it.p===p[0]?'selected':''}>${L(p[1])}</option>`).join('')}</select>`;
  return `<div class="item ${openItems.has(it.id)?'open':''}" data-id="${it.id}">
    <input class="t" type="text" data-f="t" value="${esc(it.t)}" placeholder="${tr('Popište jednou větou','Describe in one sentence')}" aria-label="${tr('Popis položky','Item description')}">
    <select data-f="m" aria-label="${tr('Jak velké','How big')}" title="${esc(L(MAG_HINT))}">${[1,2,3,4,5].map(m=>`<option value="${m}" ${+it.m===m?'selected':''}>${m} · ${L(MAG[m])}</option>`).join('')}</select>
    ${prob}
    <button class="iconbtn more" type="button" data-act="more" aria-label="${tr('Podrobnosti','Details')}" title="${tr('Podrobnosti','Details')}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    <button class="iconbtn" type="button" data-act="del-item" aria-label="${tr('Smazat položku','Delete item')}" title="${tr('Smazat','Delete')}">${X}</button>
    <div class="adv">

      <select data-f="rev" aria-label="${tr('Vratnost','Reversibility')}">${Object.keys(REV).map(k=>`<option value="${k}" ${it.rev===k?'selected':''}>${L(REV[k])}</option>`).join('')}</select>
      <select data-f="asset" aria-label="${tr('Co to chrání','What it protects')}"><option value="">${tr('chrání: nic konkrétního','protects: nothing specific')}</option>${ASSETS.map(s=>`<option value="${s[0]}" ${it.asset===s[0]?'selected':''}>${tr('chrání: ','protects: ')}${L(s[1])}</option>`).join('')}</select>
      <input class="note" type="text" data-f="note" value="${esc(it.note)}" placeholder="${tr('Poznámka, zdroj, předpoklad','Note, source, assumption')}" aria-label="${tr('Poznámka','Note')}">

function quadBox(a,o,k,expert){
  const items = a.items.filter(it=>it.o===o.id && it.k===k);
  const insp = inspFor(o,k);
  const chips = expert ? '' : `<div class="chips no-print">${insp.map((c,i)=>[c,i]).filter(([c])=>!items.some(it=>it.t===L(c[0]))).map(([c,i])=>`<button type="button" class="chip" data-act="insp" data-o="${o.id}" data-k="${k}" data-i="${i}">+ ${esc(L(c[0]))}</button>`).join('')}</div>`;
  return `<section class="qbox ${k}">
    <div class="qhead"><h3>${esc(qLabel(a,o,k))}</h3><span class="sum" data-sum="${o.id}-${k}">${f1(sumOf(a,o,k))} ${tr('b.','pts')}</span></div>
    ${expert?'':`<p class="qhint">${qHint(o,k)}</p>`}
    <div class="qbody">

      ${chips}
    </div>
  </section>`;
}
function quadrants(a,expert){
  const base = sq(a); const order = [...a.options.filter(o=>o!==base), base];
  return order.map(o=>`<div class="optgroup">
      ${isTwo(a) && !expert ? '' : `<h3><span class="badge ${o.sq?'sq':'ch'}">${o.sq?tr('výchozí stav','status quo'):tr('možnost','option')}</span> ${esc(o.name)}</h3>`}
      <div class="quad">${quadBox(a,o,'cost',expert)}${quadBox(a,o,'benefit',expert)}</div>
    </div>`).join('');
}

/* ---------- results ---------- */
function trunc(s,n){ s=String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function bars(a,R){
  const rows = R.comps; if(!rows.length) return '';
  const max = Math.max(1, ...rows.flatMap(c=>[c.pro,c.con])); const w = v => Math.max(1,(v/max)*100).toFixed(1)+'%';
  return `<div class="bars">${rows.map(c=>`<div class="bar-row"><b class="small">${esc(c.o.name)}</b>
      <div class="bar"><span class="pro" style="width:${w(c.pro)}"></span><em class="num">${tr('pro','for')} ${f1(c.pro)}</em></div>
      <div class="bar"><span class="con" style="width:${w(c.con)}"></span><em class="num">${tr('proti','against')} ${f1(c.con)}</em></div></div>`).join('')}
    <p class="small muted">${tr('„Pro“ = přínosy možnosti + náklady toho, že nic nezměníte. „Proti“ = náklady možnosti + přínosy současného stavu.','“For” = option benefits + costs of changing nothing. “Against” = option costs + status-quo benefits.')}</p></div>`;
}
function drivers(a,R){
  if(!R.comps.length || !a.items.length) return '';
  const c = R.comps.slice().sort((x,y)=>y.net-x.net)[0]; const base = R.base;
  const pro = a.items.filter(it=>(it.o===c.o.id&&it.k==='benefit')||(it.o===base.id&&it.k==='cost'));
  const con = a.items.filter(it=>(it.o===c.o.id&&it.k==='cost')||(it.o===base.id&&it.k==='benefit'));
  const li = arr => arr.length ? `<ol>${arr.map(it=>[it,itemValue(a,it)]).sort((x,y)=>y[1]-x[1]).slice(0,3).map(([it,v])=>`<li>${esc(it.t||tr('bez názvu','untitled'))} <span class="num muted">${f1(v)}</span></li>`).join('')}</ol>` : `<p class="small muted">${tr('nic','nothing')}</p>`;
  const n = Math.max(1,Math.round(Math.abs(c.net)/(4*(a.settings.wOngoing||1))));
  return `<div><h3>${tr('Co rozhoduje u ','What decides ')}${esc(trunc(c.o.name,50))}</h3><div class="drivers"><div><b style="color:var(--pro)">${tr('Nejsilněji pro','Strongest for')}</b>${li(pro)}</div><div><b style="color:var(--con)">${tr('Nejsilněji proti','Strongest against')}</b>${li(con)}</div></div>

const HOST_THEME = document.documentElement.hasAttribute('data-theme-self') ? null : document.documentElement.getAttribute('data-theme');

function toMarkdown(a){
  const R = compute(a); const Lx=[]; const d = new Date().toLocaleDateString(LANG==='cs'?'cs-CZ':'en-GB');
  Lx.push(`# ${a.title||tr('Analýza soukromí','Privacy analysis')}`, '', `*${tr('Bilance soukromí','Privacy Balance')}, ${d}*`, '');
  const why = WHY.find(w=>w[0]===a.why); if(why) Lx.push(`**${tr('Důvod','Reason')}:** ${L(why[1])}  `);
  Lx.push(`**${tr('Cíl','Goal')}:** ${a.goal==='anonymity'?tr('anonymita','anonymity'):a.goal==='privacy'?tr('soukromí','privacy'):tr('nerozhodnuto','undecided')}  `, `**${tr('Rozsah','Scope')}:** ${a.scope==='activity'?tr('konkrétní činnost: ','specific activity: ')+(a.activity||'–'):tr('celkově','overall')}  `, `**${tr('Cílený protivník','Targeted')}:** ${{no:tr('ne','no'),maybe:tr('možná','maybe'),yes:tr('ano','yes')}[a.targeted]||'–'}`, '');
  const as = ASSETS.filter(s=>a.assets[s[0]]!==undefined);
  if(as.length){ Lx.push(`## ${tr('Co chráním','What I protect')}`,''); as.forEach(s=>Lx.push(`- ${L(s[1])}: ${L(LVL[a.assets[s[0]]])}`)); Lx.push(''); }
  if(a.adv.length){ Lx.push(`## ${tr('Před kým','From whom')}`,''); ADV.filter(x=>a.adv.includes(x[0])).forEach(x=>Lx.push(`- ${L(x[3])} (${L(CAP[x[1]])})`)); Lx.push(''); }
  Lx.push(`## ${tr('Náklady a přínosy','Costs and benefits')}`,'');
  const base = sq(a); [...a.options.filter(o=>o!==base), base].forEach(o=>['cost','benefit'].forEach(k=>{
    const its = a.items.filter(it=>it.o===o.id&&it.k===k); Lx.push(`### ${qLabel(a,o,k)} (${f1(sumOf(a,o,k))})`,'');
    if(!its.length){ Lx.push(`_${tr('nic','none')}_`,''); return; }
    Lx.push(tr('| Položka | Velikost | Pravděp. | Trvání | Vratnost | Chrání | Body |','| Item | Size | Prob. | Duration | Reversibility | Protects | Points |'),'|---|---|---|---|---|---|---|');
    its.forEach(it=>Lx.push(`| ${(it.t||'').replace(/\|/g,'/')}${it.note?' ('+it.note.replace(/\|/g,'/')+')':''} | ${it.m} ${L(MAG[it.m])} | ${it.p} % | ${it.d==='once'?tr('jednorázové','one-off'):tr('opakuje se','ongoing')} | ${L(REV[it.rev]||REV.rotate)} | ${assetLabel(it.asset)||'–'} | ${f1(itemValue(a,it))} |`));
    Lx.push('');
  }));
  Lx.push(`## ${tr('Výsledek','Result')}`,'', tr('| Možnost | Náklady | Přínosy | Saldo | Simulace |','| Option | Costs | Benefits | Net | Simulation |'),'|---|---|---|---|---|');
  a.options.forEach(o=>{const t=R.t[o.id]; Lx.push(`| ${o.name}${o.sq?tr(' (dnes)',' (today)'):''} | ${f1(t.cost)} | ${f1(t.benefit)} | ${f1(t.benefit-t.cost)} | ${R.wins[o.id]!==undefined?pct(R.wins[o.id]):'–'} |`);});
  Lx.push(''); R.comps.forEach(c=>Lx.push(`- **${c.o.name}**: ${tr('pro','for')} ${f1(c.pro)}, ${tr('proti','against')} ${f1(c.con)} → ${verdict(c.margin,!a.items.length).v}`));
  const ins = insights(a,R); if(ins.length){ Lx.push('',`## ${tr('Na co myslet','Things to consider')}`,''); ins.forEach(i=>Lx.push(`- **${i.h}.** ${i.t}`)); }
  if(a.notes) Lx.push('',`## ${tr('Poznámky','Notes')}`,'',a.notes);
  Lx.push('','---',tr(`Váhy: opakování ×${a.settings.wOngoing}, stárnoucí ×${a.settings.wAging}, trvalé ×${a.settings.wPerm}. Body jsou pomůcka k přemýšlení, ne objektivní pravda.`,`Weights: ongoing ×${a.settings.wOngoing}, ageing ×${a.settings.wAging}, permanent ×${a.settings.wPerm}. Points are a thinking aid, not objective truth.`));
  return Lx.join('\n');
}

function listBox(){
  const items = state.analyses.slice().sort((x,y)=>y.updated-x.updated);
  modal(`<h2 id="modal-title">${tr('Moje analýzy','My analyses')}</h2>
    <div class="alist">${items.map(a=>`<div class="a ${a.id===state.cur?'cur':''}"><div class="grow"><b>${esc(a.title||tr('Bez názvu','Untitled'))}</b><span class="small muted">${a.items.length} ${tr('položek','items')} · ${new Date(a.updated).toLocaleDateString(LANG==='cs'?'cs-CZ':'en-GB')}</span></div>
      <button class="btn sm" type="button" data-act="open" data-id="${a.id}">${tr('Otevřít','Open')}</button>
      <button class="btn sm ghost" type="button" data-act="dup" data-id="${a.id}">${tr('Kopie','Copy')}</button>
      ${state.analyses.length>1?`<button class="btn sm ghost danger" type="button" data-act="del-an" data-id="${a.id}">${tr('Smazat','Delete')}</button>`:''}</div>`).join('')}</div>
    <div class="row"><button class="btn primary" type="button" data-act="new">${tr('+ Nová analýza','+ New analysis')}</button><button class="btn" type="button" data-act="import">${tr('Načíst ze zálohy','Restore from backup')}</button><button class="btn" type="button" data-act="export-all">${tr('Zálohovat vše','Back up all')}</button><button class="btn ghost" type="button" data-act="close">${tr('Zavřít','Close')}</button></div>
    <p class="small muted">${tr('Analýzy jsou uložené jen v tomto prohlížeči. Při vymazání dat prohlížeče zmizí, proto si je zálohujte.','Analyses live only in this browser. Clearing browser data removes them, so back them up.')}</p>`);
}
function importBox(){
  modal(`<h2 id="modal-title">${tr('Načíst ze zálohy','Restore from backup')}</h2>
    <label class="f" for="imp-file">${tr('Soubor .json','.json file')}</label><input id="imp-file" type="file" accept="application/json,.json">
    <label class="f" for="imp-text">${tr('nebo vložte obsah zálohy','or paste the backup content')}</label><textarea id="imp-text" placeholder='{"app":"bilance-soukromi", …}'></textarea>
    <p class="small" id="imp-err" style="color:var(--con)"></p>
    <div class="row"><button class="btn primary" type="button" data-act="do-import">${tr('Načíst','Restore')}</button><button class="btn ghost" type="button" data-act="close">${tr('Zrušit','Cancel')}</button></div>`);
  document.getElementById('imp-file').addEventListener('change', e=>{ const f=e.target.files[0]; if(f) f.text().then(t=>{ document.getElementById('imp-text').value=t; }); });
}
function doImport(){
  const txt = document.getElementById('imp-text').value.trim(); const err = document.getElementById('imp-err');
  try{ const j = JSON.parse(txt); const list = j.analyses || (j.analysis ? [j.analysis] : null);
    if(!list || !list.length) throw new Error(tr('V záloze není žádná analýza.','No analysis in the backup.'));
    let last=null;
    list.forEach(a=>{ if(!Array.isArray(a.options)||!Array.isArray(a.items)) throw new Error(tr('Záloha nemá očekávaný tvar.','Unexpected backup format.'));
      const n = migrate({...a, id:uid(), step:a.step||0, updated:Date.now()}); state.analyses.push(n); last=n; });
    state.cur = last.id; closeModal(); render(); toast(tr('Načteno: ','Restored: ')+list.length);
  }catch(e){ err.textContent = tr('Nepodařilo se načíst: ','Could not restore: ')+(e.message||'JSON')+' '+tr('Zkontrolujte, že jste vložili celý obsah souboru.','Check you pasted the whole file.'); }
}
function aboutBox(){
  modal(`<h2 id="modal-title">${tr('O aplikaci','About')}</h2>
    <p>${tr('Bilance soukromí vám pomůže rozhodnout, jestli se vám vyplatí nějaké opatření pro soukromí nebo anonymitu. Nikomu neříká, co dělat. Ukáže, co vás to bude stát, co vám to dá, a kde vaše odhady rozhodují.','Privacy Balance helps you decide whether a privacy or anonymity measure is worth it. It doesn’t tell you what to do. It shows what it costs, what it gives, and where your estimates matter.')}</p>
    <p><b>${tr('Vaše data:','Your data:')}</b> ${tr('aplikace nic neodesílá, nemá server, analytiku ani externí písma. Vše je v prohlížeči tohoto zařízení.','the app sends nothing; no server, analytics or external fonts. Everything stays in this browser.')}</p>
    <p><b>${tr('Instalace:','Install:')}</b> ${tr('Android (Chrome, Vanadium): menu → Nainstalovat aplikaci. iPhone (Safari): Sdílet → Přidat na plochu. Po instalaci funguje offline. V náhledu uvnitř claude.ai instalace nejde, je potřeba verze na vlastní adrese.','Android (Chrome, Vanadium): menu → Install app. iPhone (Safari): Share → Add to Home Screen. Works offline once installed. Not installable inside the claude.ai preview; host it on your own address.')}</p>
    <p class="src">${tr('Zdroje rámce a šablon','Sources for the framework and templates')}: Juraj Bednár, ${tr('přednáška o soukromí, anonymitě a cost-benefit analýze (Chain Camp)','talk on privacy, anonymity and cost-benefit analysis (Chain Camp)')}; Max Hillebrand, <i>The Praxeology of Privacy</i>; Michael Bazzell, <i>Extreme Privacy</i> (5th ed.), <i>Extreme Privacy: Mobile Devices</i>, <i>Linux Devices</i>, <i>VPNs and Firewalls</i>.</p>
    <p class="src">${tr('Licence','License')}: GNU GPL v3.0 or later. ${tr('Svobodný software: můžete ho používat, upravovat a šířit; upravené verze musí zůstat pod stejnou licencí.','Free software: use, modify and share it; modified versions must stay under the same license.')}</p>
    <h3>${tr('Slovníček','Glossary')}</h3>
    <div class="stack small">${Object.values(GLOSS).map(v=>`<div><b>${esc(L(v[0]))}.</b> ${esc(L(v[1]))}</div>`).join('')}</div>
    <div class="row"><button class="btn primary" type="button" data-act="close">${tr('Zavřít','Close')}</button></div>`);
}
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2200); }

/* ================= EVENTS ================= */
function addItem(oid,k,text){
  const a=cur(); a.items.push({id:uid(), o:oid, k, t:text||'', m:3, p:100, d:'ongoing', rev:'rotate', asset:'', note:''}); render();
  const add=document.getElementById(`add-${oid}-${k}`); if(add) add.focus();
}
function applyTemplate(key){
  const t = TEMPLATES.find(t=>t.key===key); const a = cur();
  const go = ()=>{ const n = fromTemplate(t); n.id=a.id; n.created=a.created; n.why=a.why; n.step = state.mode==='guide' ? 1 : 0;
    state.analyses[state.analyses.findIndex(x=>x.id===a.id)] = n; openItems.clear(); render(); window.scrollTo(0,0); };
  if(a.items.length) confirmBox(tr('Nahradit obsah?','Replace content?'), tr('Šablona „','Template “')+L(t.title)+tr('“ nahradí položky v aktuální analýze. Chcete-li zachovat obě, nejdřív vytvořte novou analýzu v „Moje analýzy“.','” will replace the items in this analysis. To keep both, create a new analysis in “My analyses” first.'), tr('Nahradit','Replace'), go);
  else go();
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b){ if(e.target.id==='modal') closeModal(); return; }
  const act = b.dataset.act; const a = cur();
  if(b.type==='checkbox' && act!=='adv') return;
  switch(act){
    case 'lang': state.lang = LANG = b.dataset.v; render(); break;
    case 'theme': state.theme = b.dataset.v; applyTheme(); save(); break;
    case 'mode': state.mode=b.dataset.v; render(); window.scrollTo(0,0); break;
    case 'step': a.step=+b.dataset.v; render(); window.scrollTo(0,0); break;
    case 'tpl': applyTemplate(b.dataset.k); break;
    case 'tp': a.settings.wOngoing = +b.dataset.v; render(); break;
    case 'asset': { const k=b.dataset.k, v=+b.dataset.v; if(a.assets[k]===v) delete a.assets[k]; else a.assets[k]=v; render(); break; }
    case 'adv': { const k=b.dataset.k; a.adv = b.checked ? [...new Set([...a.adv,k])] : a.adv.filter(x=>x!==k); live(); break; }
    case 'bias': { const k=b.dataset.k, v=b.dataset.v; if(a.biases[k]===v) delete a.biases[k]; else a.biases[k]=v; render(); break; }
    case 'add': { const inp=document.getElementById(`add-${b.dataset.o}-${b.dataset.k}`); addItem(b.dataset.o,b.dataset.k,inp?inp.value.trim():''); break; }
    case 'insp': { const c=inspFor(a.options.find(o=>o.id===b.dataset.o),b.dataset.k)[+b.dataset.i]; a.items.push({id:uid(),o:b.dataset.o,k:b.dataset.k,t:L(c[0]),m:c[1]||3,p:c[4]||100,d:c[2]||'ongoing',rev:c[3]||'rotate',asset:'',note:''}); render(); break; }
    case 'more': { const row=b.closest('.item'); row.classList.toggle('open'); openItems[row.classList.contains('open')?'add':'delete'](row.dataset.id); break; }
    case 'del-item': { const id=b.closest('.item').dataset.id; a.items=a.items.filter(i=>i.id!==id); render(); break; }
    case 'add-opt': a.options.push({id:uid(), name:tr('Mezicesta','Middle path'), sq:false}); render(); break;
    case 'del-opt': { const o=b.dataset.o; const op=a.options.find(x=>x.id===o); const n=a.items.filter(i=>i.o===o).length;
      const go=()=>{ a.options=a.options.filter(x=>x.id!==o); a.items=a.items.filter(i=>i.o!==o); if(!a.options.some(x=>x.sq)) a.options[0].sq=true; render(); };
      if(n) confirmBox(tr('Smazat možnost?','Delete option?'), op.name+tr(': smaže se i ',': this also deletes ')+n+tr(' položek.',' items.'), tr('Smazat','Delete'), go); else go(); break; }
    case 'set-sq': a.options.forEach(o=>o.sq = o.id===b.dataset.o); render(); break;
    case 'gloss': { const v=GLOSS[b.dataset.k]; modal(`<h2 id="modal-title">${esc(L(v[0]))}</h2><p>${esc(L(v[1]))}</p><div class="row"><button class="btn primary" type="button" data-act="close">${tr('Rozumím','Got it')}</button></div>`); break; }
    case 'list': listBox(); break;
    case 'about': aboutBox(); break;
    case 'close': closeModal(); break;
    case 'confirm-ok': closeModal(); if(confirmCb) confirmCb(); confirmCb=null; break;
    case 'open': state.cur=b.dataset.id; closeModal(); render(); break;
    case 'dup': { const src=state.analyses.find(x=>x.id===b.dataset.id); const n=JSON.parse(JSON.stringify(src)); n.id=uid(); n.title=(src.title||'')+tr(' (kopie)',' (copy)'); n.updated=Date.now(); state.analyses.push(n); state.cur=n.id; closeModal(); render(); toast(tr('Vytvořena kopie','Copy created')); break; }
    case 'del-an': { const id=b.dataset.id; const t=state.analyses.find(x=>x.id===id); confirmBox(tr('Smazat analýzu?','Delete analysis?'), (t.title||tr('Bez názvu','Untitled'))+tr(' bude z tohoto prohlížeče smazána. Nejde to vrátit.',' will be deleted from this browser. This can’t be undone.'), tr('Smazat','Delete'), ()=>{ state.analyses=state.analyses.filter(x=>x.id!==id); if(state.cur===id) state.cur=state.analyses[0].id; render(); listBox(); }); break; }
    case 'new': { const n=blankAnalysis(); n.title=tr('Nová analýza','New analysis'); state.analyses.push(n); state.cur=n.id; closeModal(); render(); window.scrollTo(0,0); break; }
    case 'import': importBox(); break;
    case 'do-import': doImport(); break;
    case 'export-md': exportBox(tr('Zpráva v Markdownu','Markdown report'), slug(a.title)+'.md', toMarkdown(a), 'text/markdown'); break;
    case 'export-json': exportBox(tr('Záloha analýzy','Analysis backup'), slug(a.title)+'.json', JSON.stringify({app:'bilance-soukromi', v:2, exported:new Date().toISOString(), analysis:a}, null, 2), 'application/json'); break;
    case 'export-all': exportBox(tr('Záloha všech analýz','Backup of all analyses'), 'bilance-soukromi-'+new Date().toISOString().slice(0,10)+'.json', JSON.stringify({app:'bilance-soukromi', v:2, exported:new Date().toISOString(), analyses:state.analyses}, null, 2), 'application/json'); break;
    case 'copy': { const t=document.getElementById('exp-text'); const done=()=>toast(tr('Zkopírováno','Copied'));
      try{ navigator.clipboard.writeText(window._exp.text).then(done).catch(()=>{ t.select(); try{document.execCommand('copy'); done();}catch(e){ toast(tr('Označte text a zkopírujte ručně','Select the text and copy manually')); } }); }catch(e){ t.select(); } break; }
    case 'dl': download(window._exp.filename, window._exp.text, window._exp.mime); break;
    case 'print': try{ window.print(); }catch(e){} break;
    case 'install': if(window._dip){ window._dip.prompt(); window._dip=null; b.hidden=true; } break;
  }
});
document.addEventListener('input', e=>{
  const el = e.target; const a = cur();
  if(el.dataset.meta){ if(el.type==='radio') return; a[el.dataset.meta]=el.value; live(); return; }
  if(el.dataset.opt){ const o=a.options.find(x=>x.id===el.dataset.opt); if(o){ o.name=el.value; live(); } return; }
  if(el.dataset.set){ if(el.type==='checkbox') return; const v=parseFloat(el.value); if(!isNaN(v)){ a.settings[el.dataset.set]=v; live(); } return; }
  const row = el.closest('.item'); if(row && el.dataset.f){
    const it = a.items.find(i=>i.id===row.dataset.id); if(!it) return; const f=el.dataset.f;
    if(f==='m') it.m=+el.value; else if(f==='p') it.p=Math.max(0,Math.min(100,+el.value||0)); else it[f]=el.value;
    live();
  }
});
document.addEventListener('change', e=>{
  const el = e.target; const a = cur();
  if(el.dataset.meta && el.type==='radio'){ a[el.dataset.meta]=el.value; render(); return; }
  if(el.dataset.set && el.type==='checkbox'){ a.settings[el.dataset.set]=el.checked; live(); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
  const el=e.target; if(e.key==='Enter' && el.dataset && el.dataset.add){ e.preventDefault(); const [o,k]=el.dataset.add.split('|'); addItem(o,k,el.value.trim()); }
});
const flush=()=>{ clearTimeout(saveTimer); try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flush(); });
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); window._dip=e; document.getElementById('install-btn').hidden=false; });
if('serviceWorker' in navigator && !inFrame() && location.protocol!=='file:'){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
render();
</script>
</body>
</html>
